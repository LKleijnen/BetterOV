name: Testen en uitrollen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: uitrollen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck app
        run: npm run check
      - name: Typecheck cron-worker
        run: npx tsc -p cron/tsconfig.json
      - name: Unit-tests
        run: npm test
      - name: Build
        run: npm run build

  uitrollen:
    needs: testen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Controleer Cloudflare-gegevens
        id: controle
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN of CLOUDFLARE_ACCOUNT_ID ontbreekt; uitrollen overgeslagen. Zie README."
            echo "overslaan=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.controle.outputs.overslaan != '1'
        run: npm ci
      - if: steps.controle.outputs.overslaan != '1'
        run: npm run build

      - name: App uitrollen
        if: steps.controle.outputs.overslaan != '1'
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.PUBLIC_FIREBASE_VAPID_KEY }}
        run: |
          # GitHub-variabelen overschrijven de waarden uit wrangler.jsonc (alleen als ze gezet zijn)
          ARGS=()
          for NAAM in PUBLIC_FIREBASE_API_KEY PUBLIC_FIREBASE_AUTH_DOMAIN PUBLIC_FIREBASE_PROJECT_ID PUBLIC_FIREBASE_APP_ID PUBLIC_FIREBASE_MESSAGING_SENDER_ID PUBLIC_FIREBASE_VAPID_KEY; do
            WAARDE="${!NAAM}"
            if [ -n "$WAARDE" ]; then ARGS+=(--var "$NAAM:$WAARDE"); fi
          done
          npx wrangler deploy "${ARGS[@]}"

      - name: Secrets naar Cloudflare
        if: steps.controle.outputs.overslaan != '1'
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          # Alleen ingevulde secrets meesturen, als JSON naar `wrangler secret bulk`
          node -e '
            const s = {};
            for (const k of ["NS_API_KEY", "FIREBASE_SERVICE_ACCOUNT", "ADMIN_EMAILS"]) if (process.env[k]) s[k] = process.env[k];
            require("fs").writeFileSync("app-secrets.json", JSON.stringify(s));
            const cron = {};
            for (const k of ["NS_API_KEY", "FIREBASE_SERVICE_ACCOUNT"]) if (process.env[k]) cron[k] = process.env[k];
            require("fs").writeFileSync("cron-secrets.json", JSON.stringify(cron));
          '
          if [ "$(cat app-secrets.json)" != "{}" ]; then npx wrangler secret bulk app-secrets.json; fi
          rm -f app-secrets.json

      - name: Cron-worker uitrollen
        if: steps.controle.outputs.overslaan != '1'
        run: |
          npx wrangler deploy --config cron/wrangler.jsonc
          if [ -f cron-secrets.json ] && [ "$(cat cron-secrets.json)" != "{}" ]; then
            npx wrangler secret bulk cron-secrets.json --config cron/wrangler.jsonc
          fi
          rm -f cron-secrets.json
